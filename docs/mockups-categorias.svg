<text x="997" y="1128" font-size="12" class="muted" font-weight="normal">También: carga, lista vacía, error y reintento.</text>
<text x="997" y="1154" font-size="12" class="muted" font-weight="normal">Alta / edición → detalle. Baja exitosa → listado.</text>
<text x="40" y="1241" font-size="14" class="muted" font-weight="normal">Navegación: menú de administrador → listado → nueva / detalle / editar → confirmación de baja.</text>
