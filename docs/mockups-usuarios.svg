<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Mockups y wireflow del módulo de usuarios de TRAMA</title>
  <desc id="description">Tablero con el flujo entre inicio, registro, login, perfil y listado, más mockups de escritorio y celular.</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f3}.surface{fill:#efeee8}.paper{fill:#fff}.ink{fill:#1e211c}.muted{fill:#686a63}.accent{fill:#9a593c}.line{stroke:#d8d5cc;stroke-width:2}.flow{stroke:#9a593c;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .title{font:700 42px Georgia,serif;fill:#1e211c}.subtitle{font:700 15px Arial,sans-serif;letter-spacing:3px;fill:#9a593c}.h1{font:600 24px Georgia,serif;fill:#1e211c}.label{font:700 11px Arial,sans-serif;letter-spacing:1.5px;fill:#686a63}.body{font:400 13px Arial,sans-serif;fill:#686a63}.tiny{font:700 9px Arial,sans-serif;letter-spacing:1px;fill:#686a63}.button{fill:#1e211c}.buttonText{font:700 10px Arial,sans-serif;letter-spacing:1px;fill:#fff}.frame{fill:#fff;stroke:#d8d5cc;stroke-width:2}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e211c" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a593c"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text x="70" y="78" class="subtitle">TRAMA · MÓDULO DE USUARIOS</text>
  <text x="70" y="125" class="title">Mockups &amp; mapa de navegación</text>
  <text x="70" y="157" class="body">Escritorio y celular · Datos simulados con el contrato del backend</text>
  <text x="70" y="218" class="subtitle">WIREFLOW</text>
  <g transform="translate(70 245)">
    <rect class="paper" width="210" height="74" rx="3"/><text x="22" y="32" class="label">INICIO / CATÁLOGO</text><text x="22" y="53" class="body">Punto de entrada</text>
    <path class="flow" d="M210 24 H270 V36 H290"/><path class="flow" d="M210 54 H250 V133 H290"/>
    <rect class="paper" x="300" width="190" height="74" rx="3"/><text x="322" y="32" class="label">REGISTRO</text><text x="322" y="53" class="body">Crear cuenta</text>
    <rect class="paper" x="300" y="96" width="190" height="74" rx="3"/><text x="322" y="128" class="label">LOGIN</text><text x="322" y="149" class="body">Usuario o admin</text>
    <path class="flow" d="M395 74 V88"/><path class="flow" d="M490 122 H545 V71 H585"/><path class="flow" d="M490 145 H545 V167 H585"/>
    <rect class="paper" x="595" y="34" width="210" height="74" rx="3"/><text x="617" y="66" class="label">MI PERFIL</text><text x="617" y="87" class="body">Sesión usuario</text>
    <rect class="paper" x="595" y="130" width="210" height="74" rx="3"/><text x="617" y="162" class="label">USUARIOS</text><text x="617" y="183" class="body">Sesión admin</text>
    <path class="flow" d="M805 167 H900"/>
    <rect class="paper" x="910" y="130" width="210" height="74" rx="3"/><text x="932" y="162" class="label">DETALLE</text><text x="932" y="183" class="body">Usuario por ID</text>
  </g>
  <text x="70" y="505" class="subtitle">PANTALLAS DE ESCRITORIO</text>
  <g transform="translate(70 535)">
    <g class="shadow">
      <rect class="frame" width="440" height="330" rx="5"/><rect class="surface" width="440" height="38"/><text x="18" y="25" class="label">TRAMA</text><text x="286" y="25" class="tiny">INICIO  PRODUCTOS</text>
      <rect class="surface" y="38" width="218" height="292"/><text x="24" y="82" class="tiny accent">TU CUENTA</text><text x="24" y="117" class="h1">Volvé a encontrar</text><text x="24" y="144" class="h1">tus favoritos.</text><text x="24" y="174" class="body">Sesión local demostrable</text>
      <text x="245" y="82" class="tiny">PASO 1 DE 1</text><text x="245" y="112" class="h1">Iniciar sesión</text><text x="245" y="145" class="tiny">CORREO ELECTRÓNICO</text><rect x="245" y="154" width="168" height="34" fill="#fff" stroke="#d8d5cc"/><text x="245" y="214" class="tiny">CONTRASEÑA</text><rect x="245" y="223" width="168" height="34" fill="#fff" stroke="#d8d5cc"/><rect class="button" x="245" y="275" width="168" height="34"/><text x="300" y="297" class="buttonText">INGRESAR</text>
    </g>
    <text x="0" y="360" class="label">01 · LOGIN</text>
    <g transform="translate(485 0)" class="shadow">
      <rect class="frame" width="440" height="330" rx="5"/><rect class="surface" width="440" height="38"/><text x="18" y="25" class="label">TRAMA</text><text x="290" y="25" class="tiny">MI PERFIL</text><rect y="38" width="440" height="78" fill="#9a593c"/><circle cx="76" cy="128" r="42" fill="#1e211c" stroke="#fff" stroke-width="5"/><text x="59" y="137" class="h1" fill="#fff">BB</text>
      <text x="35" y="205" class="tiny accent">CUENTA ACTIVA</text><text x="35" y="238" class="h1">Benjamín Bondio</text><text x="35" y="260" class="body">@benja</text><rect x="245" y="180" width="160" height="95" fill="#f8f7f3" stroke="#d8d5cc"/><text x="260" y="203" class="tiny">CORREO</text><text x="260" y="227" class="body">benja@trama.com</text><text x="260" y="254" class="tiny">ID #1</text>
    </g>
    <text x="485" y="360" class="label">02 · PERFIL</text>
    <g transform="translate(970 0)" class="shadow">
      <rect class="frame" width="490" height="330" rx="5"/><rect class="surface" width="490" height="38"/><text x="18" y="25" class="label">TRAMA</text><text x="315" y="25" class="tiny">USUARIOS  PERFIL</text><text x="25" y="82" class="tiny accent">ADMINISTRACIÓN</text><text x="25" y="116" class="h1">Usuarios</text><rect x="25" y="138" width="440" height="34" fill="#fff" stroke="#d8d5cc"/><text x="38" y="159" class="body">Buscar usuario…</text>
      <rect class="surface" x="25" y="190" width="440" height="26"/><text x="38" y="207" class="tiny">USUARIO</text><text x="194" y="207" class="tiny">NOMBRE</text><text x="322" y="207" class="tiny">CORREO</text><g class="body"><text x="38" y="239">@benja</text><text x="194" y="239">Benjamín Bondio</text><text x="322" y="239">benja@trama.com</text><text x="38" y="274">@jdefino</text><text x="194" y="274">Julieta Defino</text><text x="322" y="274">julieta@trama.com</text><text x="38" y="309">@alanst</text><text x="194" y="309">Alan Stelmaczonek</text><text x="322" y="309">alan@trama.com</text></g><path class="line" d="M25 249 H465 M25 284 H465"/>
    </g>
    <text x="970" y="360" class="label">03 · LISTADO ADMINISTRATIVO</text>
  </g>
  <text x="70" y="955" class="subtitle">ADAPTACIÓN MÓVIL</text>
  <g transform="translate(300 985)">
    <rect width="280" height="92" rx="18" fill="#fff" stroke="#d8d5cc" stroke-width="2"/><text x="22" y="34" class="label">TRAMA</text><text x="232" y="34" class="h1">☰</text><text x="22" y="66" class="body">Formulario en una columna</text><path class="flow" d="M305 46 H390"/><rect x="410" width="590" height="92" rx="18" fill="#fff" stroke="#d8d5cc" stroke-width="2"/><text x="432" y="34" class="label">USUARIOS</text><text x="432" y="66" class="body">Tabla en tarjetas · menú desplegable · controles táctiles</text>
  </g>
</svg>
